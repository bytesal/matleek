<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matleek Restaurant POS</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- XLSX Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --text-main: #0f172a;
            --text-sub: #475569;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --input-bg: rgba(255, 255, 255, 0.8);
        }

        body.dark-mode {
            --bg-color: #0b0f17;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glass-bg: rgba(18, 24, 38, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Liquid Glass Card Style */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 20px;
        }

        .liquid-input {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .liquid-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .btn-liquid-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
        }
        .btn-liquid-primary:active { transform: scale(0.98); }

        .numpad-key {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 14px;
            transition: all 0.15s ease;
        }
        .numpad-key:active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        @media print {
            .no-print, nav, #numpad-modal { display: none !important; }
            body { background: white !important; color: black !important; }
            .liquid-glass { border: none !important; box-shadow: none !important; background: white !important; }
            #dashboard-content { display: block !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #ddd !important; padding: 8px !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- شريط التنقل (Navbar Glass) -->
    <nav class="no-print sticky top-0 z-30 liquid-glass rounded-none border-x-0 border-t-0 px-6 py-3.5 mb-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-extrabold text-xl shadow-md">
                    M
                </div>
                <div>
                    <h1 class="text-base font-extrabold leading-tight">Matleek POS</h1>
                    <p class="text-[11px] text-blue-600 dark:text-blue-400 font-bold">نظام الطاولات والاستبيان</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex p-1 bg-slate-200/50 dark:bg-slate-800/50 rounded-xl text-xs font-bold border border-white/20">
                    <button onclick="switchTab('tab-live')" id="btn-tab-live" class="nav-btn px-5 py-2 rounded-lg bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm transition">إدخال الطاولات</button>
                    <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="nav-btn px-5 py-2 rounded-lg text-slate-500 dark:text-slate-400 transition">التقارير والداشبورد 🔐</button>
                </div>

                <button onclick="toggleTheme()" id="theme-btn" class="p-2.5 liquid-glass rounded-xl text-sm font-bold">
                    🌙
                </button>
            </div>

        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-6 flex-1 w-full">

        <!-- 1. واجهة إدخال الطاولات -->
        <section id="tab-live" class="tab-content">
            <div class="liquid-glass p-6 md:p-8 max-w-xl mx-auto space-y-6">
                <div class="border-b border-slate-200 dark:border-slate-800 pb-4">
                    <h2 class="text-lg font-black">تسجيل طاولة جديدة</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">أدخل التفاصيل ليتم مزامنتها مباشرة مع الخادم</p>
                </div>

                <form onsubmit="submitLiveForm(event)" class="space-y-4">
                    
                    <div>
                        <label class="block text-xs font-extrabold mb-1.5">اسم الزبون <span class="text-rose-500">*</span></label>
                        <input type="text" id="live-name" required placeholder="أدخل اسم الزبون..." class="w-full liquid-input p-3 text-sm font-semibold">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-extrabold mb-1.5">رقم الهاتف <span class="text-rose-500">*</span></label>
                            <input type="text" id="live-phone" readonly onclick="openNumpad('live-phone', 'رقم الهاتف')" required placeholder="انقر للإدخال 📱" class="w-full liquid-input p-3 text-sm font-black text-center cursor-pointer text-blue-600 dark:text-blue-400">
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold mb-1.5">رقم الطاولة <span class="text-rose-500">*</span></label>
                            <input type="text" id="live-table" readonly onclick="openNumpad('live-table', 'رقم الطاولة')" required placeholder="انقر للإدخال 🍽️" class="w-full liquid-input p-3 text-sm font-black text-center cursor-pointer text-blue-600 dark:text-blue-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-extrabold mb-1.5">ملاحظات خاصة</label>
                        <textarea id="live-notes" rows="3" placeholder="أية طلبات أو ملاحظات إضافية..." class="w-full liquid-input p-3 text-sm font-medium"></textarea>
                    </div>

                    <button type="submit" id="btn-live-submit" class="btn-liquid-primary w-full py-3.5 text-sm mt-2">
                        حفظ وإرسال الطاولة 🚀
                    </button>

                </form>
            </div>
        </section>

        <!-- 2. قسم الداشبورد والتقارير -->
        <section id="tab-dashboard" class="tab-content hidden space-y-5">
            
            <!-- قفل الحماية -->
            <div id="dashboard-lock" class="liquid-glass p-8 max-w-sm mx-auto text-center space-y-4 no-print my-12">
                <div class="w-14 h-14 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">
                    🔒
                </div>
                <div>
                    <h3 class="text-base font-black">حماية التقارير</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">يرجى إدخال رمز المرور لعرض البيانات</p>
                </div>
                <input type="password" id="dashboard-passcode" placeholder="••••" class="w-full liquid-input p-3 text-center text-lg font-black tracking-widest">
                <button onclick="unlockDashboard()" class="btn-liquid-primary w-full py-3 text-xs">تأكيد الدخول</button>
            </div>

            <!-- محتوى السجلات -->
            <div id="dashboard-content" class="hidden space-y-5">
                
                <div class="liquid-glass p-5 no-print flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <h2 class="text-base font-black">لوحة التحكم والسجلات</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-bold mt-0.5">عدد السجلات المعروضة: <span id="stat-total" class="text-blue-600 dark:text-blue-400 font-black">0</span></p>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="lockDashboardNow()" class="px-3.5 py-2 text-xs font-extrabold text-rose-500 bg-rose-500/10 rounded-xl hover:bg-rose-500/20 transition">قفل</button>
                        <button onclick="loadDashboardData()" class="px-3.5 py-2 text-xs font-extrabold liquid-glass">تحديث 🔄</button>
                        <button onclick="exportToExcel()" class="px-3.5 py-2 text-xs font-extrabold bg-emerald-600 text-white rounded-xl shadow-md">Excel 📊</button>
                        <button onclick="triggerPrint()" class="btn-liquid-primary px-4 py-2 text-xs">طباعة 🖨️</button>
                    </div>
                </div>

                <!-- شريط البحث والتصفية المتطور -->
                <div class="liquid-glass p-4 no-print flex flex-col md:flex-row gap-3 items-center">
                    <div class="flex-1 w-full">
                        <input type="text" id="search-input" oninput="filterData()" placeholder="🔍 بحث سريع باسم الزبون، رقم الهاتف، أو رقم الطاولة..." class="w-full liquid-input p-3 text-xs font-bold">
                    </div>
                    
                    <div class="flex items-center gap-2 text-xs w-full md:w-auto">
                        <span class="font-extrabold text-slate-500">من:</span>
                        <input type="date" id="date-from" onchange="filterData()" class="liquid-input p-2 font-bold">
                        <span class="font-extrabold text-slate-500">إلى:</span>
                        <input type="date" id="date-to" onchange="filterData()" class="liquid-input p-2 font-bold">
                        <button onclick="clearDateFilter()" title="إعادة ضبط" class="px-3 py-2 liquid-glass font-black text-rose-500">✖</button>
                    </div>
                </div>

                <!-- الجدول -->
                <div class="liquid-glass overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs border-collapse">
                            <thead class="bg-slate-500/5 border-b border-slate-200 dark:border-slate-800 text-slate-500 font-black">
                                <tr>
                                    <th class="p-4">الزبون</th>
                                    <th class="p-4">الهاتف</th>
                                    <th class="p-4 text-center">الطاولة</th>
                                    <th class="p-4 w-1/3">الملاحظات</th>
                                    <th class="p-4">التاريخ والوقت</th>
                                </tr>
                            </thead>
                            <tbody id="dashboard-table-body" class="divide-y divide-slate-200/40 dark:divide-slate-800/40 font-semibold">
                                <tr>
                                    <td colspan="5" class="p-8 text-center text-slate-400">جاري تحميل السجلات...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Modal لوحة الأرقام الزجاجية (Numpad Glass) -->
    <div id="numpad-modal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="liquid-glass p-6 w-full max-w-xs space-y-4 shadow-2xl relative animate-in fade-in zoom-in-95 duration-150 border-white/30">
            
            <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
                <h3 id="numpad-title" class="text-sm font-black">إدخال رقم</h3>
                <button type="button" onclick="closeNumpad()" class="text-slate-400 hover:text-rose-500 font-bold text-lg">✕</button>
            </div>

            <!-- شاشة الرقم -->
            <div id="numpad-display" class="w-full p-3 liquid-input text-center text-2xl font-black text-blue-600 dark:text-blue-400 tracking-wider min-h-[50px] flex items-center justify-center bg-blue-500/5">
            </div>

            <!-- الأزرار -->
            <div class="grid grid-cols-3 gap-2.5" dir="ltr">
                <button type="button" onclick="pressNumpadKey('1')" class="numpad-key py-3">1</button>
                <button type="button" onclick="pressNumpadKey('2')" class="numpad-key py-3">2</button>
                <button type="button" onclick="pressNumpadKey('3')" class="numpad-key py-3">3</button>
                <button type="button" onclick="pressNumpadKey('4')" class="numpad-key py-3">4</button>
                <button type="button" onclick="pressNumpadKey('5')" class="numpad-key py-3">5</button>
                <button type="button" onclick="pressNumpadKey('6')" class="numpad-key py-3">6</button>
                <button type="button" onclick="pressNumpadKey('7')" class="numpad-key py-3">7</button>
                <button type="button" onclick="pressNumpadKey('8')" class="numpad-key py-3">8</button>
                <button type="button" onclick="pressNumpadKey('9')" class="numpad-key py-3">9</button>
                <button type="button" onclick="clearNumpad()" class="numpad-key py-3 text-xs text-rose-500">مسح</button>
                <button type="button" onclick="pressNumpadKey('0')" class="numpad-key py-3">0</button>
                <button type="button" onclick="deleteNumpadKey()" class="numpad-key py-3 text-amber-500">⌫</button>
            </div>

            <button type="button" onclick="closeNumpad()" class="btn-liquid-primary w-full py-3 text-xs mt-2">
                تأكيد الرقم ✔️
            </button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzybaVrQUirtdNLIxjlQvdUjIfPniJOVijZ8KeNx_MFYWToIho14EjM4U5XPIUTrH6e/exec";

        let rawDashboardData = [];
        let isDashboardUnlocked = false;
        let currentTargetInputId = null;

        // إدارة الثيمات
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => {
                const themeBtn = document.getElementById('theme-btn');
                if(themeBtn) themeBtn.innerText = '☀️';
            });
        }

        // لوحة الأرقام التفاعلية
        function openNumpad(inputId, title) {
            currentTargetInputId = inputId;
            document.getElementById('numpad-title').innerText = title;
            document.getElementById('numpad-display').innerText = document.getElementById(inputId).value || '';
            document.getElementById('numpad-modal').classList.remove('hidden');
        }

        function closeNumpad() {
            document.getElementById('numpad-modal').classList.add('hidden');
            currentTargetInputId = null;
        }

        function pressNumpadKey(key) {
            if(!currentTargetInputId) return;
            const input = document.getElementById(currentTargetInputId);
            input.value += key;
            document.getElementById('numpad-display').innerText = input.value;
        }

        function deleteNumpadKey() {
            if(!currentTargetInputId) return;
            const input = document.getElementById(currentTargetInputId);
            input.value = input.value.slice(0, -1);
            document.getElementById('numpad-display').innerText = input.value;
        }

        function clearNumpad() {
            if(!currentTargetInputId) return;
            const input = document.getElementById(currentTargetInputId);
            input.value = '';
            document.getElementById('numpad-display').innerText = '';
        }

        // التنقل بين التبويبات
        function switchTab(tabId) {
            if (tabId !== 'tab-dashboard' && isDashboardUnlocked) lockDashboardNow();

            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'dark:bg-slate-700', 'text-blue-600', 'dark:text-blue-400', 'shadow-sm');
                btn.classList.add('text-slate-500', 'dark:text-slate-400');
            });

            const activeBtn = document.getElementById(`btn-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-500', 'dark:text-slate-400');
                activeBtn.classList.add('bg-white', 'dark:bg-slate-700', 'text-blue-600', 'dark:text-blue-400', 'shadow-sm');
            }
        }

        // الداشبورد والحماية
        function unlockDashboard() {
            if (document.getElementById('dashboard-passcode').value.trim() === "2024") {
                isDashboardUnlocked = true;
                document.getElementById('dashboard-lock').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                loadDashboardData();
            } else {
                alert("رمز الحماية غير صحيح!");
            }
        }

        function lockDashboardNow() {
            isDashboardUnlocked = false;
            document.getElementById('dashboard-passcode').value = '';
            document.getElementById('dashboard-content').classList.add('hidden');
            document.getElementById('dashboard-lock').classList.remove('hidden');
        }

        // إرسال البيانات
        function submitLiveForm(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-live-submit');
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";

            const payload = {
                action: "addLive",
                name: document.getElementById('live-name').value,
                phone: document.getElementById('live-phone').value,
                tableNo: document.getElementById('live-table').value,
                notes: document.getElementById('live-notes').value
            };

            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(() => {
                alert("تم حفظ وإرسال البيانات بنجاح! 🚀");
                document.getElementById('live-name').value = '';
                document.getElementById('live-phone').value = '';
                document.getElementById('live-table').value = '';
                document.getElementById('live-notes').value = '';
            })
            .catch(() => alert("حدث خطأ أثناء الاتصال بالسيرفر"))
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "حفظ وإرسال الطاولة 🚀";
            });
        }

        // جلب البيانات
        function loadDashboardData() {
            const tbody = document.getElementById('dashboard-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">جاري جلب البيانات...</td></tr>';

            fetch(`${SCRIPT_URL}?action=getDashboardData`)
            .then(res => res.json())
            .then(data => {
                rawDashboardData = Array.isArray(data) ? data.reverse() : [];
                document.getElementById('stat-total').innerText = rawDashboardData.length;
                renderTableData(rawDashboardData);
            })
            .catch(() => {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-rose-500 font-bold">فشل جلب البيانات من الخادم</td></tr>';
            });
        }

        function renderTableData(data) {
            const tbody = document.getElementById('dashboard-table-body');
            tbody.innerHTML = '';
            
            if(!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400 font-bold">لا توجد سجلات مطابقة للبحث</td></tr>';
                return;
            }

            data.forEach((row) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-500/5 transition-colors">
                        <td class="p-4 font-extrabold">${row.name || '-'}</td>
                        <td class="p-4 font-mono text-slate-500 dark:text-slate-400" dir="ltr">${row.phone || '-'}</td>
                        <td class="p-4 text-center"><span class="px-3 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded-lg font-black">${row.tableNo || '-'}</span></td>
                        <td class="p-4 leading-relaxed">${row.notes || '-'}</td>
                        <td class="p-4 text-slate-400 text-xs whitespace-nowrap">${row.date || '-'}</td>
                    </tr>`;
            });
        }

        // محرك البحث والفلترة الدقيق والمحدث
        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const fromDateVal = document.getElementById('date-from').value;
            const toDateVal = document.getElementById('date-to').value;

            const filtered = rawDashboardData.filter(item => {
                // تحويل كل القيم إلى نصوص للبحث الآمن
                const strName = item.name ? String(item.name).toLowerCase() : '';
                const strPhone = item.phone ? String(item.phone).toLowerCase() : '';
                const strTable = item.tableNo ? String(item.tableNo).toLowerCase() : '';

                const matchesQuery = query === '' || 
                                     strName.includes(query) || 
                                     strPhone.includes(query) || 
                                     strTable.includes(query);

                // مقارنة التواريخ بأمان
                let matchesDate = true;
                if (item.date && (fromDateVal || toDateVal)) {
                    const parsedItemDate = new Date(item.date);
                    if (!isNaN(parsedItemDate.getTime())) {
                        if (fromDateVal) {
                            const fromDate = new Date(fromDateVal);
                            fromDate.setHours(0, 0, 0, 0);
                            if (parsedItemDate < fromDate) matchesDate = false;
                        }
                        if (toDateVal) {
                            const toDate = new Date(toDateVal);
                            toDate.setHours(23, 59, 59, 999);
                            if (parsedItemDate > toDate) matchesDate = false;
                        }
                    }
                }

                return matchesQuery && matchesDate;
            });

            document.getElementById('stat-total').innerText = filtered.length;
            renderTableData(filtered);
        }

        function clearDateFilter() {
            document.getElementById('date-from').value = '';
            document.getElementById('date-to').value = '';
            filterData();
        }

        function triggerPrint() { window.print(); }

        function exportToExcel() {
            if(!rawDashboardData || rawDashboardData.length === 0) return alert("لا توجد بيانات للتصدير!");
            const cleanData = rawDashboardData.map(item => ({
                'الاسم': item.name || '',
                'الهاتف': item.phone || '',
                'الطاولة': item.tableNo || '',
                'الملاحظات': item.notes || '',
                'التاريخ': item.date || ''
            }));
            const worksheet = XLSX.utils.json_to_sheet(cleanData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Reports");
            XLSX.writeFile(workbook, "Matleek_Report.xlsx");
        }
    </script>
</body>
</html>
