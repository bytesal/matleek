Name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build APK
        run: |
          cordova create build_app com.restaurant.app "RestaurantApp"
          cd build_app
          cordova platform add android
          
          # رفع رقم الإصدار لـ 1.0.1 لتسهيل التحديث على التابلت
          sed -i 's/version="1.0.0"/version="1.0.1"/g' config.xml
          
          # توجيه التطبيق لفتح موقع GitHub Pages المباشر بدلاً من الملف الداخلي
          sed -i 's|<content src="index.html" />|<content src="https://bytesal.github.io/matleek/" />|g' config.xml
          
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-App-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
